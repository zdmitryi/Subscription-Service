version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: subscription_postgres
    environment:
      POSTGRES_DB: subscription_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - subscription_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - subscription_network

  app:
    build: .
    container_name: subscription_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/subscription_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - subscription_network

networks:
  subscription_network:
    driver: bridge

volumes:
  subscription_postgres_data: